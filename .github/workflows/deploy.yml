name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Ubuntu server over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: GH_TOKEN
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /var/www/wakalinelogistics

            php artisan down --retry=15 || true

            # First run: adopt the existing (non-git) directory as a git checkout.
            # .env, vendor/, node_modules/, public/build are gitignored, so they are left untouched.
            if [ ! -d .git ]; then
              git init -q
            fi
            git fetch "https://${GH_TOKEN}@github.com/ShoboySnr/wakalinelogistics-web.git" main
            git reset --hard FETCH_HEAD

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
            npm run build

            php artisan migrate --force

            php artisan optimize:clear
            php artisan config:cache

            php artisan up
